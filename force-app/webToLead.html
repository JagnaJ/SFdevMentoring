<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-type" content="text/html; charset=UTF-8">
    <title>Car Purchase Lead Form</title>
</head>
<body>
    <form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00Dd20000039Yaj" method="POST">

        <input type="hidden" name="oid" value="00Dd20000039Yaj">
        <input type="hidden" name="retURL" value="http://">

        <input type="hidden" name="lead_source" value="Web" />

        <label for="first_name">First Name</label>
        <input id="first_name" maxlength="40" name="first_name" size="20" type="text" required="true" /><br>

        <label for="last_name">Last Name</label>
        <input id="last_name" maxlength="80" name="last_name" size="20" type="text" required="true" /><br>

        <label for="email">Email</label>
        <input id="email" maxlength="80" name="email" size="20" type="email" required="true" /><br>

        <label for="company">Company</label>
        <input id="company" maxlength="40" name="company" size="20" type="text" /><br>

        <label for="city">City</label>
        <input id="city" maxlength="40" name="city" size="20" type="text" required="true" /><br>

        <label for="state">State/Province</label>
        <input id="state" maxlength="20" name="state" size="20" /><br>

        Fuel Type:
        <select id="00Nd2000001PiWj" name="00Nd2000001PiWj" title="Fuel Type">
            <option value="">--None--</option>
            <option value="Gasoline">Gasoline</option>
            <option value="Diesel">Diesel</option>
            <option value="Electric">Electric</option>
            <option value="Hybrid">Hybrid</option>
        </select><br>

        Condition:
        <select id="00Nd2000001PiZx" name="00Nd2000001PiZx" title="Condition">
            <option value="">--None--</option>
            <option value="New">New</option>
            <option value="Used">Used</option>
        </select><br>

        <label for="phone">Phone</label>
        <input id="phone" maxlength="40" name="phone" size="20" type="tel" required="true" /><br>

        <label for="model">Model</label>
        <input id="00Nd2000001Pijd" maxlength="20" name="00Nd2000001Pijd" size="20" type="text" /><br>

        <label for="brand">Brand</label>
        <input id="00Nd2000001Pimr" maxlength="20" name="00Nd2000001Pimr" size="20" type="text" /><br>

        <input type="submit" name="submit" value="Submit" />

    </form>
</body>
</html>
